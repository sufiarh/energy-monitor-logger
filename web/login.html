<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Energy Monitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e5e5e5;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrap {
      width: 100%;
      max-width: 360px;
      padding: 20px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo-icon {
      font-size: 40px;
      line-height: 1;
      margin-bottom: 14px;
    }

    .login-logo-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #e5e5e5;
    }

    .login-logo-sub {
      font-size: 12px;
      color: #4b5563;
      margin-top: 5px;
      letter-spacing: 0.4px;
    }

    .login-card {
      background: #161616;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 28px 24px;
    }

    .login-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .login-input {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #2d2d2d;
      border-radius: 6px;
      color: #e5e5e5;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.2s;
      letter-spacing: 2px;
    }

    .login-input:focus {
      border-color: #22c55e;
    }

    .login-input::placeholder {
      letter-spacing: 0;
      color: #374151;
    }

    .login-btn {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #22c55e;
      color: #000;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .login-btn:hover   { opacity: 0.88; }
    .login-btn:active  { opacity: 0.75; }
    .login-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .login-error {
      margin-top: 14px;
      font-size: 12px;
      color: #ef4444;
      text-align: center;
      min-height: 18px;
    }

    .login-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 11px;
      color: #374151;
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-icon">⚡</div>
    <div class="login-logo-title">Energy Monitor</div>
    <div class="login-logo-sub">HG680P · Armbian · PZEM-016</div>
  </div>

  <div class="login-card">
    <label class="login-label" for="password">Password</label>
    <input
      type="password"
      id="password"
      class="login-input"
      placeholder="Masukkan password"
      autocomplete="current-password"
      autofocus
    >
    <button class="login-btn" id="loginBtn">Masuk</button>
    <div class="login-error" id="loginError"></div>
  </div>

  <div class="login-footer">R&D – Sufi Anugrah</div>
</div>

<script>
  const btn   = document.getElementById("loginBtn");
  const input = document.getElementById("password");
  const err   = document.getElementById("loginError");

  function doLogin() {
    const pw = input.value;
    if (!pw) return;

    btn.disabled    = true;
    btn.textContent = "Memeriksa...";
    err.textContent = "";

    fetch("/api/login", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ password: pw })
    })
    .then(r => {
      if (r.ok) {
        window.location.href = "/";
      } else {
        err.textContent  = "Password salah. Coba lagi.";
        input.value      = "";
        input.focus();
      }
    })
    .catch(() => {
      err.textContent = "Gagal terhubung ke server.";
    })
    .finally(() => {
      btn.disabled    = false;
      btn.textContent = "Masuk";
    });
  }

  btn.addEventListener("click", doLogin);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
  });
</script>
</body>
</html>
